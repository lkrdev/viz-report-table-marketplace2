<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Exporting...</title></head>
<body><script>
(function () {
  var nonce = location.hash.slice(1);
  if (!nonce || !window.opener) return;
  window.addEventListener("message", function onMsg(e) {
    var d = e.data;
    if (e.source !== window.opener || !d || d.type !== "report-table-download" || d.nonce !== nonce) return;
    window.removeEventListener("message", onMsg);
    var url = URL.createObjectURL(new Blob([String(d.html || "")], { type: "application/vnd.ms-excel;charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = String(d.filename || "table.xls").replace(/[\\/:*?"<>|]/g, "_");
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); window.close(); }, 1000);
  });
  window.opener.postMessage({ type: "report-table-ready", nonce: nonce }, "*");
})();
</script></body>
</html>
